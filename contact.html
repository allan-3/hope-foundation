<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Hope Foundation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Hope Foundation</h1>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="donate.html">Donate</a></li>
        <li><a href="contact.html" class="active">Contact</a></li>
        <li><a href="login.html">Login</a></li>
      </ul>
    </nav>
  </header>

  <section>
    <h3>Get in Touch</h3>
    <p>Want to volunteer or ask a question? Send us a message below.</p>

    <div class="form">
      <form>
        <label for="name">Name</label>
        <input type="text" id="name" placeholder="Your name" autofocus required>

        <label for="email">Email</label>
        <input type="email" id="email" placeholder="name@gmail.com" autofocus>

        <label for="message">Message</label>
        <textarea id="message" rows="4" placeholder="Write your message here"></textarea>

        <button type="submit">Send Message</button>
      </form>
    </div>
  </section>

  <footer>
    <p>&copy; 2026 Hope Foundation.</p>
  </footer>

</body>
</html>
