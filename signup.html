<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | Hope Foundation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Hope Foundation</h1>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="donate.html">Donate</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="login.html">Login</a></li>
      </ul>
    </nav>
  </header>

  <section>
    <h3>Create an Account</h3>
    <p>Join us to start volunteering or donating.</p>

    <div class="form">
      <form>
        <label for="fullname">Full Name</label>
        <input type="text" id="fullname" placeholder="Your full name" autofocus required>

        <label for="email">Email</label>
        <input type="email" id="email" placeholder="name@gmail.com">

        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Create a password">

        <button type="submit">Sign Up</button>
      </form>

      <p class="note">
        Already have an account? <a href="login.html">Log in here</a>
      </p>
    </div>
  </section>

  <footer>
    <p>&copy; 2026 Hope Foundation.</p>
  </footer>

</body>
</html>
